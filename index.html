<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080914">
    <title>Yusuf Rayyan Daniel — Portfolio</title>
    <meta name="description" content="The interactive PlayStation-style portfolio of Yusuf Rayyan Daniel, Computer Science student at BINUS University. Press start to explore a 3D pixel-art bedroom and library of my projects.">
    <meta property="og:title" content="Yusuf Rayyan Daniel — Portfolio">
    <meta property="og:description" content="An interactive PlayStation-style portfolio. Press start and explore my projects as a cat in a 3D pixel-art bedroom and library.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23080914'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%23f4d6a0'%3E%F0%9F%90%88%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="pshome.css?v=home-3">
</head>
<body>
    <div class="ambient" aria-hidden="true"></div>
    <div id="particles" class="particles" aria-hidden="true"></div>
    <div id="homeTransition" class="home-transition" aria-hidden="true"></div>

    <main>
        <section id="welcomeScreen" class="screen welcome-screen is-active" aria-label="Welcome">
            <p class="welcome-prompt">Press the PS button on your controller.</p>
            <button id="psButton" class="ps-button" type="button" aria-label="Continue to profile">
                <span class="ps-mark" aria-hidden="true">PS</span>
            </button>
            <span class="screen-hint">Click anywhere or press any key</span>
        </section>

        <section id="profileScreen" class="screen profile-screen" aria-label="Choose a profile" aria-hidden="true">
            <time id="clock" class="clock"></time>
            <div class="profile-content">
                <h1>Welcome Back</h1>
                <p class="profile-question">Who's using this controller?</p>
                <div class="profile-options">
                    <a class="profile-choice" href="psapp.html?from=home" aria-label="Open Yusuf Rayyan Daniel's portfolio">
                        <span class="controller-number">1 <span aria-hidden="true">🎮</span></span>
                        <span class="avatar-ring">
                            <img class="avatar" src="image0.jpg" alt="Yusuf Rayyan Daniel">
                        </span>
                        <span class="profile-name">Yusuf Rayyan Daniel</span>
                        <span class="select-hint">Select to continue <span aria-hidden="true">↗</span></span>
                    </a>
                </div>
            </div>
            <p class="profile-footer">Choose your profile to continue</p>
        </section>
    </main>

    <script src="pshome.js?v=home-3"></script>
</body>
</html>
