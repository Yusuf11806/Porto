<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080914">
    <title>Welcome | Yusuf Rayyan Daniel</title>
    <link rel="stylesheet" href="pshome.css">
</head>
<body>
    <div class="ambient" aria-hidden="true"></div>
    <div id="particles" class="particles" aria-hidden="true"></div>

    <main>
        <section id="welcomeScreen" class="screen welcome-screen is-active" aria-label="Welcome">
            <p class="welcome-prompt">Press the PS button on your controller.</p>
            <button id="psButton" class="ps-button" type="button" aria-label="Continue to profile">
                <span class="ps-mark" aria-hidden="true">PS</span>
            </button>
            <span class="screen-hint">Click anywhere or press any key</span>
        </section>

        <section id="profileScreen" class="screen profile-screen" aria-label="Choose a profile" aria-hidden="true">
            <time id="clock" class="clock"></time>
            <div class="profile-content">
                <h1>Welcome Back</h1>
                <p class="profile-question">Who's using this controller?</p>
                <div class="profile-options">
                    <a class="profile-choice" href="psapp.html" aria-label="Open Yusuf Rayyan Daniel's page">
                        <span class="controller-number">1 <span aria-hidden="true">🎮</span></span>
                        <span class="avatar-ring">
                            <img class="avatar" src="image0.jpg" alt="Yusuf Rayyan Daniel">
                        </span>
                        <span class="profile-name">Yusuf Rayyan Daniel</span>
                        <span class="select-hint">Select to continue <span aria-hidden="true">↗</span></span>
                    </a>
                </div>
            </div>
            <p class="profile-footer">Choose your profile to continue</p>
        </section>
    </main>

    <script src="pshome.js"></script>
</body>
</html>
